[pytest]
testpaths = tests
addopts = -ra --strict-markers
filterwarnings =
    # Third-party deprecations are not actionable from this repository and would
    # otherwise bury warnings raised by the project's own code.
    ignore::PendingDeprecationWarning:shap.*

# Tests that need data/raw/ or a trained model skip themselves via the
# `requires_data` / `requires_model` guards in tests/conftest.py, so the suite
# runs green on a clean checkout with neither present.
