[pytest]
testpaths = tests
addopts = -ra --strict-markers
filterwarnings =
    # Third-party deprecations are not actionable from this repository and would
    # otherwise bury warnings raised by the project's own code.
    ignore::PendingDeprecationWarning:shap.*
    # shap warns that TreeExplainer's output shape for LightGBM binary
    # classifiers changed to a list of arrays. src/explain.py uses the
    # Explanation API and selects the attack-class axis explicitly, so it is
    # unaffected; verified by additivity (base + sum(shap) reproduces the raw
    # margin to ~1e-11) and by the orientation check in tests/test_explain.py.
    ignore:LightGBM binary classifier with TreeExplainer:UserWarning

# Tests that need data/raw/ or a trained model skip themselves via the
# `requires_data` / `requires_model` guards in tests/conftest.py, so the suite
# runs green on a clean checkout with neither present.
